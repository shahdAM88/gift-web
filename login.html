<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول</title>

    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <h1>🔐 تسجيل الدخول</h1>
        <p>هذه الصفحة خاصة بصانعة الهدايا</p>

        <form class="login-form">

            <label for="loginEmail">الإيميل</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="اكتبي إيميلك"
                required
            >

            <label for="loginPassword">كلمة المرور</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="اكتبي كلمة المرور"
                required
            >

            <button type="submit" id="loginBtn">
                دخول
            </button>

            <p id="loginMessage"></p>

        </form>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js"></script>

</body>
</html>
