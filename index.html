<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gift Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="gift-container">

        <!-- الشاشة الأولى -->
        <section class="step active" id="step1">

            <h1>في هدية هنا عشانك</h1>

            <button class="next-btn" id="next1">
                يلاا تشوفيها؟
            </button>

        </section>


        <!-- الشاشة الثانية -->
        <section class="step" id="step2">

            <p class="suspense-text">
                بس قبل ما نفتحها...
            </p>

            <h2 class="suspense-title">
                لازم نتأكد من شي
            </h2>

            <button class="next-btn" id="next2">
                يلاا بسرعههه
            </button>

        </section>


        <!-- الشاشة الثالثة -->
        <section class="step" id="step3">

            <h2 id="questionText">
                هل أنت الشخص المقصود بالهدية؟
            </h2>

            <div class="answer-area">

                <div class="answer-buttons">

                    <!-- زر نعم + الجيف -->
                    <div class="yes-wrapper">

                        <img
                            id="crySticker"
                            src="assets/cry1.gif"
                            alt="ستيكر يبكي"
                        >

                        <button id="yesBtn">
                            ايوه أنا
                        </button>

                    </div>

                    <!-- زر لا -->
                    <button id="noBtn">
                        لا مو أنا
                    </button>

                </div>

            </div>

        </section>
        <!-- الشاشة الرابعة -->
<section class="step" id="step4">

    <h2 class="gifts-title">
        يلاا وقت الهدايا 🎁
    </h2>

    <p class="gifts-subtitle">
        اختاري أول هدية تبين تفتحينها
    </p>

    <div class="gifts-grid">

        <button class="gift-card" id="songGift">
            <span class="gift-icon">🎵</span>
            <span class="gift-name">أغنية</span>
        </button>

        <button class="gift-card" id="letterGift">
            <span class="gift-icon">💌</span>
            <span class="gift-name">رسالة</span>
        </button>

        <button class="gift-card" id="photosGift">
            <span class="gift-icon">📸</span>
            <span class="gift-name">صور</span>
        </button>

    </div>

</section>
    </main>


    <script src="script.js"></script>

</body>
<div class="background-decor">
    <span>♡</span>
    <span>✦</span>
    <span>♡</span>
    <span>✧</span>
    <span>♡</span>
    <span>✦</span>
</div>

</html>
